<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — GoatAuth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐐</text></svg>" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">🐐</span>
        <span class="logo-text">GoatAuth</span>
        <p class="login-subtitle">Admin Panel</p>
      </div>
      <div class="login-error" id="loginError"></div>
      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-input" type="text" id="username" placeholder="admin" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input class="form-input" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary w-full" type="submit" style="margin-top:4px;">
          Sign In <span class="arrow">→</span>
        </button>
      </form>
      <p style="text-align:center;margin-top:20px;font-size:0.82rem;color:var(--text3);">
        <a href="/" style="color:var(--text2);text-decoration:none;">← Back to home</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const err = document.getElementById('loginError');
      err.classList.remove('show');
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('username').value, password: document.getElementById('password').value })
        });
        const d = await r.json();
        if (d.success) { window.location.href = '/admin.html'; }
        else { err.textContent = d.error || 'Login failed'; err.classList.add('show'); }
      } catch { err.textContent = 'Connection error'; err.classList.add('show'); }
    });
  </script>
</body>
</html>
